# Sources are grouped into two kinds: news and paper.
# News includes reporting, official blogs, research blogs, and in-depth analysis.
# RSS/API is preferred; webpage entries are candidates and require article-page verification.
# Paper sources only keep papers with a public code repository.
sources:
  # News
  - {name: The Guardian AI, url: https://www.theguardian.com/technology/artificialintelligenceai, rss: https://www.theguardian.com/technology/artificialintelligenceai/rss, collection: rss, kind: news, topics: [policy, society, copyright]}
  - {name: WIRED AI, url: https://www.wired.com/tag/artificial-intelligence/, collection: webpage, kind: news, topics: [product, research, privacy, society]}
  - {name: TechCrunch AI, url: https://techcrunch.com/category/artificial-intelligence/, rss: https://techcrunch.com/category/artificial-intelligence/feed/, collection: rss, kind: news, topics: [startup, product, capital, developer]}
  - {name: The Verge AI, url: https://www.theverge.com/ai-artificial-intelligence, collection: webpage, kind: news, topics: [product, platform, model]}
  - {name: Ars Technica AI, url: https://arstechnica.com/ai/, rss: https://arstechnica.com/ai/feed/, collection: rss, kind: news, topics: [developer, infrastructure, privacy, security]}
  - {name: Hacker News, url: https://news.ycombinator.com/news, rss: https://news.ycombinator.com/rss, collection: rss, kind: news, topics: [developer, open-source]}
  - {name: OpenAI News, url: https://openai.com/news/, rss: https://openai.com/news/rss.xml, collection: rss, kind: news, topics: [model, product, research, policy, safety]}
  - {name: Anthropic News, url: https://www.anthropic.com/news, collection: webpage, kind: news, topics: [model, product, research, safety, enterprise]}
  - {name: Hugging Face Blog, url: https://huggingface.co/blog, rss: https://huggingface.co/blog/feed.xml, collection: rss, kind: news, topics: [open-source, model, dataset, developer]}
  - {name: Simon Willison's Weblog, url: https://simonwillison.net/, rss: https://simonwillison.net/atom/everything/, collection: rss, kind: news, topics: [developer, security, model]}

  # Papers: keep only code-backed papers; weight is higher than ordinary sources
  - {name: Papers With Code, url: https://huggingface.co/papers, api: https://huggingface.co/api/daily_papers, collection: papers, kind: paper, weight: 4, limit: 12, topics: [research, paper, code, open-source]}
